name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Tests
        env:
          DEPLOYMENT_ENV: development
          DB_PASSWORD: ci
          JWT_SECRET_KEY: ci-secret-key-long-enough-for-validation
        run: pytest -q

      - name: Migrations form a single linear chain
        env:
          DB_PASSWORD: ci
          JWT_SECRET_KEY: ci-secret-key-long-enough-for-validation
        # Catches the classic multi-head merge, where two branches each add a
        # migration on the same parent and `upgrade head` becomes ambiguous.
        run: |
          heads=$(alembic heads | wc -l)
          test "$heads" -eq 1 || { echo "Expected 1 migration head, found $heads"; alembic heads; exit 1; }

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
        run: npm run build

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: services/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
